<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Scheibler to POLMO | CFI Hotels Group</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #efe6d9;
      --ink: #201b17;
      --brown: #2c1609;
      --copper: #b87345;
    }

    body {
      margin: 0;
      background: var(--brown);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 1440px);
      margin: 0 auto;
      background: var(--paper);
      box-shadow: 0 22px 90px rgba(0, 0, 0, .35);
    }

    header {
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: #17130f;
      color: white;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-weight: 700;
      font-size: 14px;
    }

    header a {
      color: #e3b58b;
      text-decoration: none;
      letter-spacing: .12em;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      padding: 22px 32px 28px;
      background: var(--paper);
      color: #5d5147;
      font-size: 14px;
      line-height: 1.5;
    }

    footer strong {
      color: var(--copper);
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>CFI Hotels Group</div>
      <a href="CFI_Hotels_Group_project_EN.pdf">Download PDF</a>
    </header>
    <img src="CFI_Hotels_Group_project_EN.png" alt="English presentation: From Scheibler to POLMO - two new event spaces in Lodz">
    <footer>
      <strong>English version.</strong> This file is a separate translated copy of the final CFI Hotels Group project.
    </footer>
  </main>
</body>
</html>
